{% extends "base.html" %}
{% block title %}VLESS Manager: Логи{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="../static/style.css">
{% endblock %}
{% block content %}

<header class="page-head">
  <div class="page-head-text">
    <h1>Логи</h1>
    <p class="page-sub">События панели: предупреждения и ошибки, импорт, проверки и применение конфига.</p>
  </div>
  <div class="page-actions">
    <button class="btn btn-danger-ghost" onclick="clearLogs()">Очистить логи</button>
  </div>
</header>

<div class="filters">
  <select id="logLevelFilter" class="input filter-select" onchange="setLevel(this.value)" aria-label="Уровень логов">
    <option value="">Все уровни</option>
    <option value="DEBUG">DEBUG</option>
    <option value="INFO">INFO</option>
    <option value="WARN">WARN</option>
    <option value="ERROR">ERROR</option>
  </select>
</div>

<div class="data-error" id="logError" role="status" hidden></div>

<div class="table-wrap">
  <table class="logs-table">
    <thead>
      <tr><th>Время</th><th>Уровень</th><th>CID</th><th>Сообщение</th></tr>
    </thead>
    <tbody id="logBody"></tbody>
  </table>
  <div class="pagination-bar" id="logPagination" hidden>
    <button class="btn btn-sm" id="logShowMoreBtn" onclick="loadMore()">Показать ещё</button>
    <span class="pagination-info" id="logPaginationInfo"></span>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="{{ url_for('static', filename='logs.js') }}"></script>
{% endblock %}
